<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>상품</title>
    <style>
        /* 제품 카드 전체 스타일 */
#productAll{
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
}
.product-card {
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    background-color: #fff;
    transition: transform 0.3s;
    width: 23%;
    text-align: center;
    margin: 10px;
    font-family: Arial, sans-serif;
}

.product-card:hover {
    transform: scale(1.05);
}

/* 이미지 스타일 */
.product-card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: opacity 0.3s;
}

.product-card img:hover {
    opacity: 0.9;
}

/* 제품명 스타일 */
.product-card .product-name {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin: 10px 0;
    text-decoration: none;
}

.product-card .product-name:hover {
    color: #007bff;
}

/* 설명 텍스트 스타일 */
.product-card .product-description {
    font-size: 14px;
    color: #666;
    padding: 0 10px;
    margin-bottom: 10px;
    height: 40px;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 가격 스타일 */
.product-card .price {
    font-size: 16px;
    color: #e63946;
    font-weight: bold;
    margin-bottom: 10px;
}

/* 카테고리 스타일 */
.product-card .category {
    font-size: 13px;
    color: #888;
    margin-bottom: 15px;
}

    /* 검색 */
        /* 전체 검색 영역 스타일 */
#searchArea {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    max-width: 500px;
    margin: 20px auto;
    background-color: #f8f9fa;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

/* 검색 키 선택 드롭다운 스타일 */
#searchArea select.pSearchKey {
    padding: 8px;
    border: 1px solid #ced4da;
    border-radius: 4px;
    background-color: #fff;
    font-size: 14px;
    color: #495057;
    transition: box-shadow 0.2s;
}

#searchArea select.pSearchKey:focus {
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    border-color: #007bff;
}

/* 검색어 입력 창 스타일 */
#searchArea input.pSearchKeyWord {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 14px;
    color: #495057;
    background-color: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
}

#searchArea input.pSearchKeyWord:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
}

/* 검색 버튼 스타일 */
#searchArea button#searchBox {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    color: #fff;;
    background-color: #bc97d2;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.1s;
}

#searchArea button#searchBox:hover {
    background-color: #0056b3;
}

#searchArea button#searchBox:active {
    transform: scale(0.98);
}
    /* 페이징 창 */
        /* 전체 페이징 버튼 스타일 */
.pagination {
    display: flex;
    justify-content: center;
    gap: 5px;
    list-style: none;
    padding: 0;
    margin: 20px 0;
}
    /* 제품 카테고리 구역 */
/* 카테고리 목록 스타일 */
#productCategory {
    display: flex;
    justify-content: center;
    gap: 15px;
    list-style: none;
    padding: 0;
    margin: 20px 0;
    font-family: Arial, sans-serif;
}

/* 카테고리 아이템 스타일 */
#productCategory li {
    padding: 10px 20px;
    color: #fff;
    background-color: #bc97d2;
    border: 1px solid #ced4da;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s, color 0.3s;
}

/* 호버 효과 */
#productCategory li:hover {
    background-color: #e2e6ea;
}

/* 선택된 카테고리 스타일 */
#productCategory li.active {
    background-color: #bc97d2;
    color: white;
    border-color: #007bff;
}

    </style>
</head>
<body>
    <div th:replace="~{/header.html :: header }"></div>

    <div id="content">
        <!-- 카테고리 구역 -->
        <ul id="productCategory">
            
        </ul>
        <!-- 검색구역 -->
        <div id="searchArea">
            <select class="pSearchKey">
                <option value="product_name">상품명</option>
            </select>

            <input class="pSearchKeyWord" />
            <button type="button" onclick="search()" id="searchBox">검색</button>
        </div> <br/>

        <!-- 상품 구역 -->
        <div id="productAll">
            
        </div>

        <!-- 페이징 구역 -->
        <nav aria-label="Page navigation example">
            <ul class="pagination">
                <li class="page-item"> <a class="page-link" onclick="productAllPrint()">이전</a> </li>
            </ul>
        </nav> 

    </div>

    <script src="/js/product/product.js"></script>
    <div th:replace="~{/footer.html :: footer }"></div>
</body>
</html>
