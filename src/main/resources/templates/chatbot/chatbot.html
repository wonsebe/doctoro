<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Chatbot in JavaScript</title>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  href="/css/chatbot/chatbot.css" rel="stylesheet">
    <!-- Google Fonts Link For Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    
  </head>
  <body>
    <div th:replace="~{/header.html :: header }"></div>

    <button class="chatbot-toggler">
      <span class="material-symbols-rounded">mode_comment</span>
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="chatbot">
      <header>
        <h2>로토봇</h2>
        <span class="close-btn material-symbols-outlined">close</span>
      </header>
      <ul class="chatbox">
        <li class="chat incoming">
          <span class="material-symbols-outlined">smart_toy</span>
          <p >Hi there 👋<br>안녕하세요</p>
          <!-- <div class="cPrint">
            
          </div> -->
        <!-- <button onclick="roChat()" type="button">전송</button> -->
  
    
        </li>
      </ul>
      <div class="chat-input">
        <textarea class="text" placeholder="Enter a message..." spellcheck="false" required></textarea>
        <span id="send-btn" onclick="roChat()" class="material-symbols-rounded">send</span>
      </div>
    </div>

    <script src="/js/chatbot/chatbot.js"></script>

  </body>
</html>
